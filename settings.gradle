pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
        maven {
            url 'https://nexus.teammt.dev/repository/mt-plugins-public/'
            credentials {
                username = providers.gradleProperty('teammtNexusUsername').orNull
                password = providers.gradleProperty('teammtNexusPassword').orNull
            }
        }
    }
}

rootProject.name = 'VillagerGUIApi'

include 'api'
include 'plugin'
include 'adapter-bundle'

// One Gradle subproject per NMS version adapter (mirrors the Maven <modules> list).
[
    'v1_3_1', 'v1_3_2', 'v1_4_5', 'v1_4_6', 'v1_4_R1',
    'v1_5_R1', 'v1_5_R2', 'v1_5_R3',
    'v1_6_R1', 'v1_6_R2', 'v1_6_R3',
    'v1_7_R1', 'v1_7_R2', 'v1_7_R3', 'v1_7_R4',
    'v1_8_R1', 'v1_8_R2', 'v1_8_R3',
    'v1_9_R1', 'v1_9_R2',
    'v1_10_R1', 'v1_11_R1', 'v1_12_R1',
    'v1_13_R1', 'v1_13_R2', 'v1_14_R1', 'v1_15_R1',
    'v1_16_R1', 'v1_16_R2', 'v1_16_R3',
    'v1_17_R1', 'v1_18_R1', 'v1_18_R2',
    'v1_19_R1', 'v1_19_R2', 'v1_19_R3',
    'v1_20_R1', 'v1_20_R2', 'v1_20_R3'
].each { include "adapters:${it}-adapter" }
