// VillagerGUIApi — standalone multi-version Spigot plugin (NO M-Lib, NO relocation).
// Mirrors the Maven parent pom: spigot-api 1.12.2 + lombok provided to every module,
// one library module per NMS version, and a shaded plugin that bundles every TeamMT module.
allprojects {
    group = 'TeamMT'
    version = '1.5.0'
}

subprojects {
    apply plugin: 'java'

    java {
        // NMS 1.17+ class files are bytecode 60+, which a JDK 8 javac cannot read. Compile with a
        // modern JDK toolchain while still emitting Java 8 bytecode (mirrors Maven's -source/-target 8).
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:-options'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url 'https://nexus.teammt.dev/repository/maven-public/'
            content { includeGroupByRegex 'dev\\.teammt\\..*' }
        }
        maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url 'https://libraries.minecraft.net/' }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        compileOnly 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'
        // lombok 1.18.24 (the pom-pinned version) cannot run on the JDK 21 toolchain required to
        // read 1.17+ NMS bytecode; 1.18.34 is the JDK 21-compatible processor (no semantic change).
        compileOnly 'org.projectlombok:lombok:1.18.34'
        annotationProcessor 'org.projectlombok:lombok:1.18.34'

        // Server-provided libraries that newer NMS (1.13+) signatures reference at compile time.
        compileOnly 'com.mojang:brigadier:1.0.18'
        compileOnly 'com.mojang:authlib:1.5.21'
        compileOnly 'org.slf4j:slf4j-api:2.0.6'
    }
}

// Map each adapter module to the exact nms-bukkit version its Maven pom pinned (the directory
// name is the CraftBukkit R-revision, which does NOT equal the NMS artifact version).
def nmsVersions = [
    'v1_3_1' : '1.3.1',  'v1_3_2' : '1.3.2',
    'v1_4_5' : '1.4.5',  'v1_4_6' : '1.4.6',  'v1_4_R1': '1.4.7',
    'v1_5_R1': '1.5',    'v1_5_R2': '1.5.1',  'v1_5_R3': '1.5.2',
    'v1_6_R1': '1.6.1',  'v1_6_R2': '1.6.2',  'v1_6_R3': '1.6.4',
    'v1_7_R1': '1.7.2',  'v1_7_R2': '1.7.5',  'v1_7_R3': '1.7.9',  'v1_7_R4': '1.7.10',
    'v1_8_R1': '1.8',    'v1_8_R2': '1.8.3',  'v1_8_R3': '1.8.8',
    'v1_9_R1': '1.9.2',  'v1_9_R2': '1.9.4',
    'v1_10_R1': '1.10.2', 'v1_11_R1': '1.11.2', 'v1_12_R1': '1.12.2',
    'v1_13_R1': '1.13',  'v1_13_R2': '1.13.2', 'v1_14_R1': '1.14.4', 'v1_15_R1': '1.15',
    'v1_16_R1': '1.16.1', 'v1_16_R2': '1.16.3', 'v1_16_R3': '1.16.4',
    'v1_17_R1': '1.17',  'v1_18_R1': '1.18',  'v1_18_R2': '1.18.2',
    'v1_19_R1': '1.19',  'v1_19_R2': '1.19.3', 'v1_19_R3': '1.19.4',
    'v1_20_R1': '1.20.1', 'v1_20_R2': '1.20.2', 'v1_20_R3': '1.20.4'
]

configure(subprojects.findAll { it.name.endsWith('-adapter') }) {
    def key = it.name.replaceFirst(/-adapter$/, '')
    def nms = nmsVersions[key]
    def nmsJar = file("${System.properties['user.home']}/.m2/repository/org/craftbukkit/nms-bukkit/${nms}/nms-bukkit-${nms}.jar")
    dependencies {
        implementation project(':api')
        if (nmsJar.exists()) {
            compileOnly "org.craftbukkit:nms-bukkit:${nms}"
        }
    }
    if (!nmsJar.exists()) {
        // NMS jar unavailable locally — skip compilation for this old adapter.
        tasks.withType(JavaCompile).configureEach { enabled = false }
    }
}
